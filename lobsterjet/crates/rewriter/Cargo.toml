[package]
name = "lobsterjet-rewriter"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Streaming HTML/CSS/JS-literal URL rewriter for LobsterJet (wasm-bindgen entry + pure-Rust API)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { workspace = true, optional = true }

[features]
default = ["wasm"]
wasm = ["dep:wasm-bindgen"]
