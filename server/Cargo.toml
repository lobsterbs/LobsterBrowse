[workspace]
resolver = "2"
members = [
  "crates/wisp-core",
  "crates/wisp-extensions",
  "crates/guard",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bytes = "1"
thiserror = "1"
sha2 = "0.10"
ed25519-dalek = "2"
rand = "0.8"
subtle = "2"
