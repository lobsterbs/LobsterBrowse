[package]
name = "lobster-server"
description = "LobsterBrowse Wisp server: tokio + axum WSS entrypoint"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "lobster-server"
path = "src/main.rs"

[dependencies]
zeolite-server = { git = "https://github.com/lobsterbs/Zeolite", rev = "a385fa9bb9e2fdbecd5e39f8fe0d58a9ad2462ef" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# wreq: reqwest hard fork with BoringSSL and per-browser TLS/HTTP2
# emulation (Zeolite #149/#160 class: bot-management zones read the
# rustls ClientHello as non-browser and edge-403 relayed requests).
# Chrome124 matches the UA profile the relay forwards. No openssl-sys
# anywhere in this tree, so the boring symbols need no prefixing.
wreq = { version = "0.16", features = ["cookies", "stream", "gzip", "brotli", "zstd", "deflate"] }
wreq-util = "0.2"
serde_json = "1"
sha2 = { workspace = true }
