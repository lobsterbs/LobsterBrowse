[package]
name = "lobster-server"
description = "LobsterBrowse Wisp server: tokio + axum WSS entrypoint"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "lobster-server"
path = "src/main.rs"

[dependencies]
zeolite-server = { git = "https://github.com/lobsterbs/Zeolite", branch = "main" }
adblock = { path = "../../crates/adblock" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
futures-util = "0.3"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "stream"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
