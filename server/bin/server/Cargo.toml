[package]
name = "lobster-server"
description = "LobsterBrowse Wisp server: tokio + axum WSS entrypoint"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "lobster-server"
path = "src/main.rs"

[dependencies]
zeolite-server = { git = "https://github.com/lobsterbs/Zeolite", rev = "deccb4337015316f3f8930195a1342d100d2f732" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "stream"] }
serde_json = "1"
sha2 = { workspace = true }
