name: clawd-egg
on:
  push:
    branches: ["beta/zeolite-nativetransit"]
    paths: [".github/workflows/clawd-egg.yml"]
permissions:
  contents: write
jobs:
  ship-gif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vendor the Clawd sleeping gif
        run: |
          mkdir -p ui/public
          curl -sSL -o ui/public/clawd-sleep.gif https://raw.githubusercontent.com/Harriszed/mascot-studio/main/public/mascot/gifs/asleep-nightcap.gif
          if ! echo "056572c890e02d6f5eb120c99167e5200d71483211c0ad39b706749f1fc65907  ui/public/clawd-sleep.gif" | sha256sum -c -; then
            curl -sSL -o ui/public/clawd-sleep.gif https://harriszed.github.io/mascot-studio/mascot/gifs/asleep-nightcap.gif
            echo "056572c890e02d6f5eb120c99167e5200d71483211c0ad39b706749f1fc65907  ui/public/clawd-sleep.gif" | sha256sum -c -
          fi
          git config user.name "zl-bot"
          git config user.email "zl-bot@users.noreply.github.com"
          git add ui/public/clawd-sleep.gif
          git rm -q .github/workflows/clawd-egg.yml
          git commit -q -m "chore(ui): vendor the Clawd sleeping gif asset (22,196 bytes)"
          git push origin HEAD:refs/heads/beta/zeolite-nativetransit
