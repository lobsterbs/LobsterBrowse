name: rustfmt fix

on:
  push:
    paths:
      - ".github/workflows/rustfmt-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        working-directory: server
        run: cargo fmt --all
      - name: Commit formatted sources
        run: |
          git config user.name "lobster-ci"
          git config user.email "ci@users.noreply.github.com"
          git add server
          git diff --cached --quiet || (git commit -m "style(server): cargo fmt" && git push)
