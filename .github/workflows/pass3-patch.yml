name: pass3 patch

on:
  push:
    paths:
      - ".github/workflows/pass3-patch.yml"
      - ".github/pass3-mode"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mode
        id: mode
        run: echo "mode=$(cat .github/pass3-mode 2>/dev/null || echo inspect)" >> "$GITHUB_OUTPUT"
      - name: Inspect
        if: steps.mode.outputs.mode == 'inspect'
        run: |
          cd server/bin/server/src
          echo ----URLATTR
          sed -n '760,840p' main.rs
          echo ----REWRITETAG
          sed -n '1468,1620p' main.rs
      - name: Apply
        if: steps.mode.outputs.mode == 'apply'
        run: |
          cd server/bin/server/src
          python3 "$GITHUB_WORKSPACE/.github/pass3-apply.py"
      - name: Verify
        if: steps.mode.outputs.mode == 'apply'
        working-directory: server
        run: |
          cargo fmt --all
          cargo build --locked
          cargo test --locked
          cargo clippy --locked -- -D warnings
      - name: Commit
        if: steps.mode.outputs.mode == 'apply'
        run: |
          git config user.name "lobster-ci"
          git config user.email "ci@users.noreply.github.com"
          git add server .github/pass3-mode
          git diff --cached --quiet || (git commit -m "fix(server): pass-3 main.rs patches (challenge regex construction test)" && git push)
