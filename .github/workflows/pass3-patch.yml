name: pass3 patch

on:
  push:
    paths:
      - ".github/workflows/pass3-patch.yml"
      - ".github/pass3-mode"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mode
        id: mode
        run: echo "mode=$(cat .github/pass3-mode 2>/dev/null || echo inspect)" >> "$GITHUB_OUTPUT"
      - name: Inspect
        if: steps.mode.outputs.mode == 'inspect'
        run: |
          cd server/bin/server/src
          echo ----INCLUDES
          grep -n 'include_str' main.rs
          echo ----TESTMODS
          grep -n 'mod \|cfg(test)' main.rs
          echo ----TAIL
          tail -c 4500 main.rs
          echo ----FAVICON
          grep -n -i 'favicon' main.rs || echo none
          echo ----FORMACTION
          grep -n 'formaction' main.rs || echo none
          grep -n '"action"' main.rs | head -8
          echo ----REWRITEFNS
          grep -n 'fn rewrite_url_attr\|fn rewrite_tag\|fn rewrite_srcset\|fn rewrite_css\|fn strip_base_tags' main.rs
          echo ----CHALLENGE
          grep -n 'CHALLENGE_HOSTS' main.rs | head -20
      - name: Apply
        if: steps.mode.outputs.mode == 'apply'
        run: |
          cd server/bin/server/src
          python3 /home/runner/work/LobsterBrowse/LobsterBrowse/.github/pass3-apply.py
      - name: Verify
        if: steps.mode.outputs.mode == 'apply'
        working-directory: server
        run: |
          cargo fmt --all
          cargo build --locked
          cargo test --locked
          cargo clippy --locked -- -D warnings
      - name: Commit
        if: steps.mode.outputs.mode == 'apply'
        run: |
          git config user.name "lobster-ci"
          git config user.email "ci@users.noreply.github.com"
          git add server .github/pass3-mode
          git diff --cached --quiet || (git commit -m "fix(server): pass-3 main.rs patches (challenge regex test)" && git push)
