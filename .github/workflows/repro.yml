name: repro
on:
  push:
    branches: [tmp-fileread]
    paths: [zlrepro-trigger]
jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i playwright@1.49.1
      - run: npx playwright install chromium --with-deps
      - name: run-repro
        run: |
          cat > repro.mjs <<'ZLEOF'
          import { chromium } from 'playwright';
          import { readFileSync } from 'fs';
          const cfg = JSON.parse(readFileSync('zlrepro-config.json', 'utf8'));
          const TARGET = cfg.target;
          const SITE = cfg.site;
          const WAIT = cfg.wait || 30000;
          const log = (...a) => console.log('ZLREPRO', ...a);
          log('CFG ' + JSON.stringify(cfg));
          const browser = await chromium.launch();
          const page = await browser.newPage();
          page.on('console', (m) => { const t = m.text(); if (!t.includes('Custom state pseudo')) log('console', m.type(), t.slice(0, 200)); });
          page.on('requestfailed', (r) => log('reqfail', r.url().slice(0, 220), (r.failure() && r.failure().errorText) || ''));
          page.on('framenavigated', (f) => log('framenav', f.url().slice(0, 250)));
          for (let i = 0; i < 12; i++) {
            try { await page.goto(TARGET, { waitUntil: 'load', timeout: 60000 }); break; }
            catch (e) { log('goto-retry', String(e).slice(0, 120)); await page.waitForTimeout(5000); }
          }
          log('app-title', await page.title());
          await page.waitForTimeout(4000);
          const copy = await page.evaluate(() => document.body ? document.body.innerText.slice(0, 900) : '');
          log('COPY ' + JSON.stringify(copy));
          await page.fill('#lb-search-input', SITE);
          await page.press('#lb-search-input', 'Enter');
          await page.waitForTimeout(WAIT);
          const state = await page.evaluate(() => {
            const ifr = document.querySelector('iframe');
            let loc = null, ready = null, err = null, ev = null;
            try { loc = ifr && ifr.contentWindow && ifr.contentWindow.location.href; ready = ifr && ifr.contentDocument && ifr.contentDocument.readyState; } catch (e) { err = String(e).slice(0, 120); }
            try { ev = ifr && ifr.contentWindow ? ifr.contentWindow.eval('1+1') : null; } catch (e) { ev = 'EVALERR ' + String(e).slice(0, 80); }
            return { src: ifr && ifr.src, loc, ready, err, ev, title: document.title };
          });
          log('STATE ' + JSON.stringify(state));
          const dumps = await page.evaluate(() => ({
            logs: localStorage.getItem('lobsterbrowse-logs'),
            tabs: localStorage.getItem('lobsterbrowse-tabs'),
          }));
          log('LOGS-BEGIN');
          if (dumps.logs) for (const l of JSON.parse(dumps.logs)) log('LOG ' + JSON.stringify(l));
          log('LOGS-END');
          log('TABS ' + (dumps.tabs || 'null'));
          await browser.close();
          ZLEOF
          node repro.mjs
  bundlecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: |
          fetch() {
            url="$1"; out="$2"
            for i in 1 2 3 4 5 6 7 8; do
              if curl -fsSL --max-time 120 "$url" -o "$out"; then return 0; fi
              sleep 10
            done
            return 1
          }
          for base in https://lobsterbrowse-server.onrender.com https://lobsterbrowse-beta.onrender.com; do
            echo "ZLBUNDLE-BASE $base"
            fetch "$base/build?v=$RANDOM" build.json || { echo "ZLBUILD-FAIL $base"; continue; }
            echo "ZLBUILD $(cat build.json)"
            fetch "$base/?v=$RANDOM" index.html || { echo "ZLHTML-FAIL $base"; continue; }
            jsurls=$(grep -oE '(src|href)="[^"]+\.js"' index.html | cut -d'"' -f2 || true)
            if [ -z "$jsurls" ]; then echo "ZLHTML-NOJS $base"; fi
            for u in $jsurls; do
              case "$u" in
                /*) url="$base$u" ;;
                *) url="$base/$u" ;;
              esac
              echo "ZLJS $url"
              fetch "$url" bundle.js || { echo "ZLJS-FAIL $url"; continue; }
              for needle in "Never stop browsing" "Browse the web through a private proxy" "Browse freely" "Private proxy with ad blocking" "Loaded through this server" "issues/new" "DevTerminal" "xterm"; do
                if grep -qF "$needle" bundle.js; then echo "ZLFIND $base HAS $needle"; else echo "ZLFIND $base LACKS $needle"; fi
              done
            done
          done
