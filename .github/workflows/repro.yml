name: repro-tmp
on: push
jobs:
  repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null 2>&1
      - run: npx playwright install chromium --with-deps >/dev/null 2>&1
      - name: run repro
        run: |
          cat > repro.js <<'ZLEOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ args: ['--disable-blink-features=AutomationControlled'] });
            const page = await browser.newPage();
            const navs = []; const fails = []; const reqs = [];
            page.on('framenavigated', f => { try { navs.push(f.url()); } catch (e) {} });
            page.on('requestfailed', r => { try { fails.push(r.url().slice(0, 220)); } catch (e) {} });
            page.on('request', r => { try { const u = r.url(); if (u.includes('/lj/') || u.includes('/r/') || u.includes('__zl_nav__')) reqs.push(r.method() + ' ' + u.slice(0, 220)); } catch (e) {} });
            await page.goto('https://lobsterbrowse-server.onrender.com/', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(6000);
            await page.fill('#lb-search-input', 'https://m.ome.tv/');
            await page.press('#lb-search-input', 'Enter');
            for (let i = 0; i < 14; i++) {
              await page.waitForTimeout(5000);
              const frames = page.frames().map(f => f.url().slice(0, 200));
              console.log('ZLREPRO T+' + ((i + 1) * 5) + 's NAVCOUNT ' + navs.length + ' FAILCOUNT ' + fails.length);
              console.log('ZLREPRO frames ' + JSON.stringify(frames));
            }
            console.log('ZLREPRO allnavs ' + JSON.stringify(navs));
            console.log('ZLREPRO allfails ' + JSON.stringify(fails.slice(0, 40)));
            console.log('ZLREPRO reqsample ' + JSON.stringify(reqs.slice(0, 60)));
            await browser.close();
          })().catch(e => { console.log('ZLREPRO error ' + e); process.exit(1); });
          ZLEOF
          node repro.js 2>&1
