name: branch-cleanup (one-shot)
on:
  push:
    paths:
      - .github/workflows/branch-cleanup.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: delete superseded branches via the refs API
        run: |
          set -e
          for b in fix/scout-2026-10-20 fix/relay-proxy-hops feat/user-wisp-primary; do
            enc=$(printf '%s' "$b" | sed 's|/|%2F|g')
            code=$(curl -s -o /tmp/out -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/lobsterbs/LobsterBrowse/git/refs/heads/$enc")
            echo "$b -> $code $(cat /tmp/out)"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
