name: Fix spa_fallback tokio attribute

on:
  push:
    branches: [beta/zeolite-nativetransit]

permissions:
  contents: write

concurrency:
  group: fix-spa-fallback
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decide
        id: check
        run: |
          needed=$(python3 - <<'PY'
          src = open('server/bin/server/src/main.rs', encoding='utf-8').read()
          print('true' if src.count('#[tokio::main]\n/// SPA fallback hardening') == 1 else 'false')
          PY
          )
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
        if: steps.check.outputs.needed == 'true'
      - name: Apply the fix (move attribute, make spa_fallback async)
        if: steps.check.outputs.needed == 'true'
        run: |
          python3 - <<'PY'
          p = 'server/bin/server/src/main.rs'
          src = open(p, encoding='utf-8').read()
          broken = '#[tokio::main]\n/// SPA fallback hardening'
          main_anchor = '\n\nasync fn main() {\n    tracing_subscriber::fmt()'
          main_fixed = '\n\n#[tokio::main]\nasync fn main() {\n    tracing_subscriber::fmt()'
          sync_fn = 'fn spa_fallback(headers: HeaderMap) -> Response {'
          async_fn = 'async fn spa_fallback(headers: HeaderMap) -> Response {'
          assert src.count(broken) == 1, 'broken anchor count != 1: %d' % src.count(broken)
          assert src.count(main_anchor) == 1, 'main anchor count != 1: %d' % src.count(main_anchor)
          assert src.count(sync_fn) == 1, 'sync fn anchor count != 1: %d' % src.count(sync_fn)
          out = src.replace(broken, '/// SPA fallback hardening')
          out = out.replace(main_anchor, main_fixed)
          out = out.replace(sync_fn, async_fn)
          expect = len(src.encode('utf-8')) + 6
          assert len(out.encode('utf-8')) == expect, 'unexpected byte length'
          open(p, 'w', encoding='utf-8').write(out)
          print('fix applied; bytes:', len(out.encode('utf-8')))
          PY
      - name: Format, build, clippy gate
        if: steps.check.outputs.needed == 'true'
        working-directory: server
        run: |
          cargo fmt --all
          cargo build --locked -p lobster-server
          cargo clippy --locked -p lobster-server --message-format=short -- -D warnings
      - name: Commit and push (fix + remove this workflow)
        run: |
          git config user.name "lobster-ci"
          git config user.email "ci@users.noreply.github.com"
          git rm -q .github/workflows/fix-spa-fallback.yml
          if [ "${{ steps.check.outputs.needed }}" = "true" ]; then git add server/bin/server/src/main.rs server/Cargo.lock 2>/dev/null || git add server/bin/server/src/main.rs; fi
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          if [ "${{ steps.check.outputs.needed }}" = "true" ]; then
            git commit -m "fix(server): #[tokio::main] back above main + spa_fallback async (axum 0.7 handlers must be async; fixes the 7afaddd9 build break, unblocks beta deploys)"
          else
            git commit -m "chore(ci): remove one-shot spa_fallback fix workflow (fix already applied elsewhere)"
          fi
          git pull --rebase --autostash origin beta/zeolite-nativetransit
          git push origin HEAD:beta/zeolite-nativetransit
