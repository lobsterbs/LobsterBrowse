name: w63 one-shot beta merge
on:
  push:
    branches: ['w63-lb-mcp']
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: w63-lb-mcp
          fetch-depth: 0
      - name: apply patch, format, verify, push beta, cleanup
        run: |
          set -eux
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable --component rustfmt > /dev/null
          source "$HOME/.cargo/env"
          python3 .w63-patch.py
          rustfmt --edition 2021 server/bin/server/src/main.rs
          echo "fd62ebf1a330f515ee95d5e7621ab9104cfdc63dbf00b000c2d324fa6ed1b188  server/bin/server/src/main.rs" | sha256sum -c -
          git config user.name "w63-merge-bot"
          git config user.email "action@users.noreply.github.com"
          rm .w63-patch.py .github/workflows/w63-oneshot.yml .w63-write-probe.txt
          git add -A
          git commit -m "feat(server): read-only MCP diagnostics endpoint /mcp (bearer-auth JSON-RPC 2.0, fail closed without LB_MCP_TOKEN)"
          git push origin HEAD:beta/zeolite-nativetransit
          git push origin --delete w63-lb-mcp
