# Keep the free-tier Render services awake. They spin down after
# 15 idle minutes; a cold app or wisp service kills the engine
# transport paths (the Brave search route rides the standalone wisp
# backend, the rest rides the app-service relay channel), and a cold
# fixture/beta flakes the transit-live CI job. Public repo: the
# scheduled runner is free.
name: Keep-alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping free-tier services
        run: |
          for url in \
            https://lobsterbrowse-g0bs.onrender.com/healthz \
            https://lobsterbrowse-beta-9bct.onrender.com/healthz \
            https://lobsterbrowse-content-2djv.onrender.com/healthz \
            https://lobsterbrowse-wisp-8ec1.onrender.com/ \
            https://lobsterbrowse-fixture-okp6.onrender.com/ ; do
            if ! curl -fsS --max-time 120 "$url" > /dev/null; then
              echo "::warning::keep-alive ping failed: $url"
            fi
          done
