# Keep the free-tier Render services awake. They spin down after
# 15 idle minutes; a cold app service kills the engine relay channel
# (the Brave search route rides it), and a cold fixture/beta flakes
# the transit-live CI job. Public repo: the
# scheduled runner is free.
name: Keep-alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping free-tier services
        run: |
          for url in \
            https://lobsterbrowse-yiy9.onrender.com/healthz \
            https://lobsterbrowse-beta-cts6.onrender.com/healthz \
            https://lobsterbrowse-content-ocbg.onrender.com/healthz \
            https://lobsterbrowse-fixture-rtus.onrender.com/ ; do
            if ! curl -fsS --max-time 120 "$url" > /dev/null; then
              echo "::warning::keep-alive ping failed: $url"
            fi
          done
