name: w34-beta-uirevert
on:
  push:
    paths: ['.github/workflows/w34-beta-uirevert.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  revert-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta/zeolite-nativetransit
          fetch-depth: 0
      - name: restore the pre-merge beta ui tree
        run: |
          set -euo pipefail
          git config user.name 'fad 6767'
          git config user.email 'fad6767@users.noreply.github.com'
          PRE=9ea2eb74bbdbe08168e43803a933a5ffc5e97945
          git merge-base --is-ancestor 2a796d509fe6a972029ea3a1c14d4705e6aa182a HEAD || { echo beta diverged, aborting; exit 1; }
          git checkout "$PRE" -- ui/
          git rm -q -f --ignore-unmatch ui/src/browser/displayAddress.ts
          git add -A ui/
          if git status --porcelain ui/ | grep -q .; then
            git commit -q -m 'revert(ui): restore the beta UI tree to 9ea2eb7'
            git push origin HEAD:beta/zeolite-nativetransit
            echo REVERT_PUSHED
          else
            echo NOTHING_TO_REVERT
          fi
          if [ -f .github/workflows/w34-beta-uirevert.yml ]; then
            git rm -q .github/workflows/w34-beta-uirevert.yml
            git commit -q -m 'ci: remove the one-shot ui revert runner'
            git push origin HEAD:beta/zeolite-nativetransit
            echo RUNNER_REMOVED
          fi
