name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve tag (workflow_dispatch cuts it from the workspace version)
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="$(grep -m1 '^version' server/Cargo.toml | tr -d ' " ' | cut -d= -f2 | tr -d ' ')"
          git fetch origin main --quiet
          git tag "v${VER}" origin/main
          git push origin "v${VER}" --quiet
          echo "TAG=v${VER}" >> "$GITHUB_ENV"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${TAG:-${GITHUB_REF#refs/tags/}}"
          CODENAME="$(grep -o 'lb_version = format!("{} [A-Za-z]*' server/bin/server/src/main.rs | head -1 | sed 's/.*{} //')"
          gh release create "${TAG}" --title "LobsterBrowse ${TAG#v} - ${CODENAME}" --generate-notes
