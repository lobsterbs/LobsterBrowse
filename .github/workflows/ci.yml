name: CI
on:
  push:
    branches: ["main", "beta/zeolite-nativetransit"]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Format check
        run: cargo fmt --all --check
      - name: Build (locked)
        run: cargo build --locked
      - name: Tests (locked)
        run: cargo test --locked
      - name: Clippy (locked)
        run: |
          set -o pipefail
          cargo clippy --locked --message-format=short -- -D warnings 2>&1 | tee /tmp/clippy.txt
          code=$?
          grep -E "(error|warning):" /tmp/clippy.txt | head -20 | while IFS= read -r l; do echo "::error::CLIPPY $l"; done || true
          exit $code

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Navigation poll regression check
        run: node --experimental-strip-types ../tests/poll-recovery/check.mjs
      - name: Settings search regression check
        run: node --experimental-strip-types ../tests/settings-search/check.mjs
      - name: Log privacy regression check
        run: node --experimental-strip-types ../tests/log-privacy/check.mjs
      - name: AMO package integrity regression check
        run: node --experimental-strip-types ../tests/amo-integrity/check.mjs
      - name: Content worker relay regression check
        run: node --experimental-strip-types ../tests/relay-recovery/check.mjs

  # #130: fixture-only self-test of the transit router against the
  # in-repo fixtures; it never exercises a deployed pair (that is
  # transit-live below), so the bare "transit" name oversold it.
  transit-fixture:
    name: Tier-0 fixture self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tier-0 fixture checks
        run: node tests/transit/check.mjs

  # Deployed-pair gate: runs the full check against the LIVE Render
  # pair (fixture + beta). This gates the deployed service, which can
  # lag this commit while Render rebuilds. When a push changes a server
  # gate row (like the #67 gone-notice), the run can fail until Render
  # serves the new build; rerun the job after the deploy goes live. A
  # lag on an unchanged row means the previous deploy is verified, not
  # that this push is live. The next beta push re-gates whatever is
  # live then.
  transit-live:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/beta/zeolite-nativetransit'
    env:
      FIXTURE_ORIGIN: https://lobsterbrowse-fixture-rtus.onrender.com
      LB_ORIGIN: https://lobsterbrowse-beta-cts6.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Render free tier spins the pair down after idle; the edge answers
      # 503 while the instance wakes. Warm both origins (any non-503 code
      # counts, including the honest /zl/ 503 notice route) before the
      # strict check runs.
      - name: Wake the deployed pair
        run: |
          for url in "$FIXTURE_ORIGIN/data.json" "$LB_ORIGIN/healthz"; do
            for i in $(seq 1 24); do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$url" || true)
              if [ "$code" != "503" ] && [ "$code" != "000" ]; then echo "$url awake (HTTP $code)"; break; fi
              echo "$url cold (HTTP $code), retry $i"; sleep 5
            done
            if [ "$code" = "503" ] || [ "$code" = "000" ]; then echo "::error::WARMUP failed for $url (HTTP $code)"; exit 1; fi
          done
      - name: Deployed-pair checks (live fixture + beta)
        run: node tests/transit/check.mjs
