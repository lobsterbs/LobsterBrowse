name: CI
on:
  push:
    branches: ["main", "beta/zeolite-nativetransit"]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Format check
        run: cargo fmt --all --check
      - name: Build (locked)
        run: cargo build --locked
      - name: Tests (locked)
        run: cargo test --locked
      - name: Clippy (locked)
        run: |
          set -o pipefail
          cargo clippy --locked --message-format=short -- -D warnings 2>&1 | tee /tmp/clippy.txt
          code=$?
          grep -E "(error|warning):" /tmp/clippy.txt | head -20 | while IFS= read -r l; do echo "::error::CLIPPY $l"; done || true
          exit $code

