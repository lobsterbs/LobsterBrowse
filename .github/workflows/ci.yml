name: CI
on:
  push:
    branches: ["main", "beta/zeolite-nativetransit"]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Format check
        run: cargo fmt --all --check
      - name: Build (locked)
        run: cargo build --locked
      - name: Tests (locked)
        run: cargo test --locked
      - name: Clippy (locked)
        run: |
          cargo clippy --locked --message-format=short -- -D warnings 2>&1 | tee /tmp/clippy.txt | grep -E "(error|warning):" | head -20 | while IFS= read -r l; do echo "::error::CLIPPY $l"; done
          if grep -qE "(error|warning):" /tmp/clippy.txt; then exit 1; fi

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build

  transit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tier-0 fixture checks
        run: node tests/transit/check.mjs
