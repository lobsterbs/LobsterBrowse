name: Apply load-visibility patch (code only)

on:
  push:
    branches: ["bot/apply-load-visibility"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-load-visibility
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recover chunks from pinned commit, apply code files, verify, commit
        run: |
          set -uo pipefail
          fail() { echo "::error::LVFAIL phase=$1"; exit 1; }
          phase=guard
          if grep -q "autoLoadGate" ui/src/pages/Browser.tsx; then
            echo "Patch already applied; skipping"
            exit 0
          fi
          phase=pin
          CHK=2aafb1178e53d7f39ab256b317974aac94ddc443
          git cat-file -e "$CHK^{commit}" || fail "$phase"
          phase=recover
          mkdir -p /tmp/lvchunks || fail "$phase"
          for i in $(seq -w 1 36); do
            p="_apply/chunks/c$i.b64"
            git show "$CHK:$p" > "/tmp/lvchunks/c$i.b64" || fail "$phase:show:$i"
          done
          phase=md5
          for f in /tmp/lvchunks/c*.b64; do base64 -d "$f"; done > /tmp/lv.patch || fail "$phase"
          gotmd5=$(md5sum /tmp/lv.patch | cut -d' ' -f1)
          gotsz=$(wc -c < /tmp/lv.patch)
          nchunk=$(ls /tmp/lvchunks/ | wc -l)
          echo "chunk count: $nchunk; patch size: $gotsz; patch md5: $gotmd5"
          if [ "$gotmd5" != "0ed66eb971cfdeb1316e33c953372591" ]; then
            echo "::error::LVFAIL md5 got=$gotmd5 size=$gotsz nchunk=$nchunk"
            exit 1
          fi
          phase=applycheck
          git apply --check --verbose --whitespace=nowarn --exclude=.github/workflows/ci.yml /tmp/lv.patch || fail "$phase"
          phase=apply
          git apply --whitespace=nowarn --exclude=.github/workflows/ci.yml /tmp/lv.patch || fail "$phase"
          phase=exists
          test -f ui/src/browser/navGate.ts || fail "$phase"
          test -f tests/load-visibility/check.mjs || fail "$phase"
          grep -q "autoLoadGate" ui/src/pages/Browser.tsx || fail "$phase"
          phase=nodecheck
          node --experimental-strip-types tests/load-visibility/check.mjs || fail "$phase"
          phase=stage
          git add ui/src tests || fail "$phase"
          echo "--- staged files ---"
          git diff --cached --name-only
          nstaged=$(git diff --cached --name-only | wc -l)
          [ "$nstaged" -eq 4 ] || fail "$phase:$nstaged"
          phase=commit-push
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ui): load tabs only when the Browse view is visible; blank the frame before each navigation" || fail "$phase"
          git push || fail "$phase"
