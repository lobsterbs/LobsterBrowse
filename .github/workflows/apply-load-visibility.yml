name: Apply load-visibility patch

on:
  push:
    branches: ["bot/apply-load-visibility"]
    paths-ignore: ["_apply/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-load-visibility
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reassemble, apply, verify, commit
        run: |
          set -euo pipefail
          if grep -q "autoLoadGate" ui/src/pages/Browser.tsx; then
            echo "Patch already applied; skipping"
            exit 0
          fi
          for f in _apply/chunks/c*.b64; do base64 -d "$f"; done > /tmp/lv.patch
          echo "0ed66eb971cfdeb1316e33c953372591  /tmp/lv.patch" | md5sum -c -
          git apply --check --verbose /tmp/lv.patch
          git apply /tmp/lv.patch
          node --experimental-strip-types tests/load-visibility/check.mjs
          git rm -r -q _apply
          git rm -q .github/workflows/apply-load-visibility.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ui): load tabs only when the Browse view is visible; blank the frame before each navigation"
          git push
