name: pin-bump-one-shot
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        branch: [main, beta/zeolite-nativetransit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
      - name: Apply the zeolite dist pin bump
        run: |
          set -eu
          test "$(grep -c 'ARG ZEOLITE_COMMIT=90f65c8319d3ae6018d8a8e50d4dada092885346' Dockerfile)" = "1"
          test "$(grep -c 'ZEOLITE_SW_SHA=e6c1874b7b0f8222' Dockerfile)" = "1"
          sed -i 's|ARG ZEOLITE_COMMIT=90f65c8319d3ae6018d8a8e50d4dada092885346|ARG ZEOLITE_COMMIT=f0ad3de320ede2d25ac94a373469db0af45dc14a|' Dockerfile
          sed -i 's|ZEOLITE_SW_SHA=e6c1874b7b0f8222|ZEOLITE_SW_SHA=b489e3179d77798a|' Dockerfile
          test "$(grep -c 'ARG ZEOLITE_COMMIT=f0ad3de320ede2d25ac94a373469db0af45dc14a' Dockerfile)" = "1"
          test "$(grep -c 'ZEOLITE_SW_SHA=b489e3179d77798a' Dockerfile)" = "1"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dockerfile
          git commit -m "chore(engine): pin zeolite dist f0ad3de, sw sha b489e3179d77798a (#511)"
          git push origin HEAD:${{ matrix.branch }}
