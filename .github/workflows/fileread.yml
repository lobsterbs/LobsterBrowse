name: fileread

on:
  push:
    branches: [tmp-fileread]

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: dump files
        run: |
          set -e
          mkdir -p /tmp/dump
          dump() {
            key=$1; sha=$2; path=$3
            git show "$sha:$path" > /tmp/dump/$key
            echo "ZLGITHASH-$key $(git rev-parse "$sha:$path")"
            echo "ZLSIZE-$key $(wc -c < /tmp/dump/$key)"
            rm -f /tmp/dump/$key.part.*
            split -b 8000 -d -a 2 /tmp/dump/$key /tmp/dump/$key.part.
            i=0
            for f in $(ls /tmp/dump/$key.part.* | sort); do
              n=$(printf "%02d" $i)
              echo "ZLFILE-$key-$n-BEGIN"
              base64 -w 0 "$f"
              echo ""
              echo "ZLFILE-$key-$n-END"
              i=$((i+1))
            done
          }
          dump mbrw2 c46ed0a78360f0531c4b470fbd42f98c405a3a2b ui/src/pages/Browser.tsx
          dump bbrw2 7238b542b631393f3c7a65463a971e7d9e6e6170 ui/src/pages/Browser.tsx
