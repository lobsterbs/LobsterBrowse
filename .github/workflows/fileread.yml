name: fileread
on:
  push:
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: lobsterbs/LobsterBrowse
      - run: |
          set -e
          cd /home/runner/work/LobsterBrowse/LobsterBrowse
          echo "=== HEADS ==="
          git rev-parse origin/main origin/beta/zeolite-nativetransit
          git rev-parse origin/main:ui/src/pages/Browser.tsx origin/beta/zeolite-nativetransit:ui/src/pages/Browser.tsx
          echo "=== MAIN BROWSER DIFF c46ed0a7..731a88bb ==="
          git diff c46ed0a7 731a88bb -- ui/src/pages/Browser.tsx
          echo "=== BETA BROWSER DIFF 7238b542..45f10dff ==="
          git diff 7238b542 45f10dff -- ui/src/pages/Browser.tsx
          echo "=== SETTINGS DEFAULTS ==="
          grep -n "proxyEngine" ui/src/settings.ts | head -8
          sed -n '120,152p' ui/src/settings.ts
          echo "=== THEME LB-LOADING MAIN ==="
          grep -n "lb-loading\|m3e-loading-indicator\|m3e-circular" ui/src/theme.css
          echo "=== THEME LB-LOADING BETA ==="
          git show origin/beta/zeolite-nativetransit:ui/src/theme.css | grep -n "lb-loading\|m3e-loading-indicator\|m3e-circular"
          echo "=== M3E.D.TS BETA ==="
          git show origin/beta/zeolite-nativetransit:ui/src/m3e.d.ts | grep -n "loading-indicator\|progress-indicator"
          echo "=== M3E.D.TS MAIN ==="
          grep -n "loading-indicator\|progress-indicator" ui/src/m3e.d.ts
          echo "=== DONE8 ==="
