name: fileread
on:
  push:
    branches: [tmp-fileread]
  workflow_dispatch: {}

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: beta workflows
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/lobsterbs/LobsterBrowse.git /tmp/repo
          cd /tmp/repo
          git fetch --quiet --depth 1 origin d8bae4475a5165d9451d0c14b7e75c530aea353a
          git checkout --quiet --detach d8bae4475a5165d9451d0c14b7e75c530aea353a
          echo "ZLWF-DIR-BEGIN"
          ls -1 .github/workflows/
          echo "ZLWF-DIR-END"
          dump() {
            key="$1"; path="$2"
            if [ ! -f "$path" ]; then
              echo "ZLERR-$key NOTFOUND"
              return 0
            fi
            size=$(wc -c < "$path")
            echo "ZLGITHASH-$key $(git hash-object "$path")"
            echo "ZLSIZE-$key $size"
            n=0
            chunks=$(( (size + 7999) / 8000 ))
            while [ "$n" -lt "$chunks" ]; do
              echo "ZLFILE-$key-$(printf %02d "$n")-BEGIN"
              dd if="$path" bs=8000 skip="$n" count=1 2>/dev/null | base64 -w 0
              echo ""
              echo "ZLFILE-$key-$(printf %02d "$n")-END"
              n=$(( n + 1 ))
            done
          }
          dump bci .github/workflows/ci.yml
