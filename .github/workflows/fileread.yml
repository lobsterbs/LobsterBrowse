name: fileread

on:
  push:
    branches: [tmp-fileread]

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: recon
        run: |
          set -e
          echo "ZLGITHASH-main $(git rev-parse origin/main)"
          echo "=== LOG MAIN ==="
          git log --oneline -12 origin/main
          echo "=== GREP malformed ==="
          grep -rn "malformed" --include="*.rs" --include="*.ts" --include="*.tsx" --include="*.css" --include="*.html" . | grep -v node_modules | head -30
          echo "=== GREP lb-load-error ==="
          grep -rn "lb-load-error" --include="*.rs" --include="*.ts" --include="*.tsx" . | head -30
          echo "=== GREP engine_error_page ==="
          grep -n "engine_error_page\|error_html\|error page" server/bin/server/src/main.rs | head -30
          echo "=== GREP progress/loading in ui ==="
          grep -rn "progress\|Progress" ui/src --include="*.tsx" --include="*.ts" --include="*.css" | head -60
          echo "=== GREP m3e components used ==="
          grep -rn "m3e-" ui/src --include="*.tsx" -o | grep -o "m3e-[a-z-]*" | sort | uniq -c | sort -rn | head -40
          echo "=== GREP startpage ==="
          grep -rni "startpage" ui/src server/bin/server/src server/crates 2>/dev/null | head -20
          echo "=== LOG theme.css ==="
          git log --oneline -8 origin/main -- ui/src/theme.css
          echo "=== LOG main.rs ==="
          git log --oneline -8 origin/main -- server/bin/server/src/main.rs
          echo "=== LOG Browser.tsx ==="
          git log --oneline -8 origin/main -- ui/src/pages/Browser.tsx
          echo "=== DONE ==="
