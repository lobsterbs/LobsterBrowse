name: fileread-tmp
on:
  push:
    branches: [tmp-fileread]
jobs:
  chunk:
    runs-on: ubuntu-latest
    steps:
      - name: print chunks
        run: |
          read_chunked() {
            f="$1"; ref="$2"
            curl -fsSL "https://raw.githubusercontent.com/lobsterbs/LobsterBrowse/$ref/AGENTS.md" -o "$f"
            echo "ZLGITHASH-$f-$(git hash-object "$f")"
            echo "ZLSIZE-$f-$(wc -c < "$f")"
            split -b 8000 -d -a 2 "$f" "part_$f."
            for c in part_$f.*; do
              echo "ZLFILE-$f-${c#part_$f.}-BEGIN"
              base64 -w 0 "$c"
              echo
              echo "ZLFILE-$f-${c#part_$f.}-END"
            done
            rm -f "part_$f."*
          }
          read_chunked b404 AGENTS.md
          read_chunked main main
