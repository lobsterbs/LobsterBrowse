name: fileread
on: push
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: audit and dump
        run: |
          git clone --depth 1 --branch main https://github.com/lobsterbs/LobsterBrowse.git /tmp/lbmain >/dev/null 2>&1
          git clone --depth 1 --branch beta/zeolite-nativetransit https://github.com/lobsterbs/LobsterBrowse.git /tmp/lbbeta >/dev/null 2>&1
          for d in /tmp/lbmain /tmp/lbbeta; do
            tag=MAIN
            if [ "$d" = "/tmp/lbbeta" ]; then tag=BETA; fi
            echo "ZLGREP-$tag-BEGIN"
            grep -rn "window.open" "$d/ui" 2>/dev/null || echo "(no window.open hits in ui)"
            grep -rn 'target="_blank"' "$d/ui/src" 2>/dev/null || echo "(no target=_blank hits in ui/src)"
            echo "ZLGREP-$tag-END"
          done
          dump() {
            key=$1; f=$2; dir=$3
            echo "ZLGITHASH-$key $(cd "$dir" && git hash-object "$f")"
            echo "ZLSIZE-$key $(stat -c%s "$dir/$f")"
            rm -f /tmp/chunk-$key-*
            split -b 8000 -d "$dir/$f" /tmp/chunk-$key-
            i=0
            for c in /tmp/chunk-$key-*; do
              echo "ZLFILE-$key-$(printf %02d $i)-BEGIN"
              base64 -w 0 "$c"
              echo ""
              echo "ZLFILE-$key-$(printf %02d $i)-END"
              i=$((i+1))
            done
          }
          dump mdt2 ui/src/pages/DevTools.tsx /tmp/lbmain
          dump mbrw2 ui/src/pages/Browser.tsx /tmp/lbmain
