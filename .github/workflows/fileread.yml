name: fileread-tmp
on: push

jobs:
  reprodump:
    runs-on: ubuntu-latest
    steps:
      - run: |
          dump() {
            key="$1"; url="$2"
            curl -fsSL "$url" -o "tmp_$key" || { echo "ZLFAIL-$key-curl"; exit 0; }
            echo "ZLGITHASH-$key-$(git hash-object "tmp_$key")"
            echo "ZLSIZE-$key-$(wc -c < "tmp_$key")"
            split -b 8000 -d -a 2 "tmp_$key" "part_$key."
            for p in part_$key.*; do
              n="$(basename "$p" | sed "s/^part_${key}.//")"
              echo "ZLFILE-$key-$n-BEGIN"
              base64 -w 0 "$p"
              echo ""
              echo "ZLFILE-$key-$n-END"
            done
          }
          dump ryml "https://raw.githubusercontent.com/lobsterbs/LobsterBrowse/e72acb66eec1db8184158f0efbf6a6db7ed94140/.github/workflows/repro.yml"
          dump rcfg "https://raw.githubusercontent.com/lobsterbs/LobsterBrowse/e72acb66eec1db8184158f0efbf6a6db7ed94140/zlrepro-config.json"
