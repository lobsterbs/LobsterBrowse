name: fileread-tmp
on: push
jobs:
  s1:
    runs-on: ubuntu-latest
    steps:
      - name: print chunks
        run: |
          dump() {
            key="$1"; url="$2"; off="$3"; len="$4"
            curl -fsSL "$url" -o "tmp_$key"
            tail -c +"$off" "tmp_$key" | head -c "$len" > "f_$key"
            echo "ZLGITHASH-$key-$(git hash-object "f_$key")"
            echo "ZLSIZE-$key-$(wc -c < "f_$key")"
            split -b 8000 -d -a 2 "f_$key" "part_$key."
            for p in part_$key.*; do
              n="$(basename "$p" | sed "s/^part_//; s/^$key\.//")"
              echo "ZLFILE-$key-$n-BEGIN"
              base64 -w 0 "$p"
              echo ""
              echo "ZLFILE-$key-$n-END"
            done
          }
          dump s1 "https://raw.githubusercontent.com/lobsterbs/Zeolite/78704d612807caa3113014240d2ca7e26b9f031c/sw.js" 1 54000
