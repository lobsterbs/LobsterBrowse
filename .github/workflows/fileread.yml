name: fileread
on:
  push:
    branches: [tmp-fileread]
  workflow_dispatch: {}

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: session diffs
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/lobsterbs/LobsterBrowse.git /tmp/repo
          cd /tmp/repo
          git fetch --quiet --depth 1 origin a526de15ce9efa83951db3d4a1b9b68eef64de82 2fe4a0da061283a4ecabd3cb6c0b5b18cc82fc12 6ad80be65da8a5da2163bb56a77a77a81fb9165a d8bae4475a5165d9451d0c14b7e75c530aea353a
          echo "ZLDIFF-MAIN-STAT-BEGIN"
          git diff --stat a526de15ce9efa83951db3d4a1b9b68eef64de82 2fe4a0da061283a4ecabd3cb6c0b5b18cc82fc12
          echo "ZLDIFF-MAIN-STAT-END"
          echo "ZLDIFF-MAIN-BEGIN"
          git diff a526de15ce9efa83951db3d4a1b9b68eef64de82 2fe4a0da061283a4ecabd3cb6c0b5b18cc82fc12
          echo "ZLDIFF-MAIN-END"
          echo "ZLDIFF-BETA-STAT-BEGIN"
          git diff --stat 6ad80be65da8a5da2163bb56a77a77a81fb9165a d8bae4475a5165d9451d0c14b7e75c530aea353a -- . ':(exclude)ui/package-lock.json'
          echo "ZLDIFF-BETA-STAT-END"
          echo "ZLDIFF-BETA-BEGIN"
          git diff 6ad80be65da8a5da2163bb56a77a77a81fb9165a d8bae4475a5165d9451d0c14b7e75c530aea353a -- . ':(exclude)ui/package-lock.json'
          echo "ZLDIFF-BETA-END"
