name: fileread
on:
  push:
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: lobsterbs/LobsterBrowse
      - run: |
          set -e
          cd /home/runner/work/LobsterBrowse/LobsterBrowse
          echo "=== CURL /r/ INCognito CHALLENGE ==="
          curl -sS --max-time 45 -D /tmp/h.txt -o /tmp/body.html "https://lobsterbrowse-server.onrender.com/r/aHR0cHM6Ly93d3cuc3RhcnRwYWdlLmNvbS9zcC9zZWFyY2g_cXVlcnk9dGVzdA?lb_inc=1" || echo CURLFAIL
          head -25 /tmp/h.txt || true
          wc -c /tmp/body.html || true
          grep -c 'id="anubis_challenge"' /tmp/body.html || echo no-marker
          grep -o 'within.website[^"\\ ]*' /tmp/body.html | head -5 || true
          echo "--- challenge context ---"
          grep -n -m1 -B2 -A12 'anubis_challenge' /tmp/body.html || echo no-challenge-served
          echo "=== ZEO FACTS ==="
          cd /tmp 2>/dev/null || cd /home/runner/work/LobsterBrowse/LobsterBrowse
          git clone --depth 50 https://github.com/lobsterbs/Zeolite /tmp/zeolite 2>&1 | tail -1 || true
          cd /tmp/zeolite
          for f in app/src/sw.ts app/src/codec.ts app/src/routekey.ts app/src/__tests__/challenge.test.ts docs/error-pages.md docs/cookies.md AGENTS.md; do
            echo "BLOB $(git rev-parse HEAD:$f) SIZE $(git cat-file -s $(git rev-parse HEAD:$f)) $f"
          done
          echo "=== GREPS SW.TS ==="
          grep -n "no-store\|cache.match\|caches.match\|ZL_PAGE_LIMIT\|ZL_PAGE_CACHE\|NetEntry\|ZEOLITE_VERSION =" app/src/sw.ts | head -25
          echo "=== GREPS AGENTS ==="
          grep -n "route key\|errorpage\|error page\|challenge\|pass-challenge" AGENTS.md | head -15
          echo "=== DUMP CODEC ==="
          split -b 8000 <(base64 -w 0 app/src/codec.ts) /tmp/zcd_
          i=0
          for f in /tmp/zcd_*; do
            i=$((i+1))
            echo "ZLFILE-zcd-$i-BEGIN"
            cat "$f"
            echo ""
            echo "ZLFILE-zcd-$i-END"
          done
          echo "=== DUMP ROUTEKEY ==="
          base64 -w 0 app/src/routekey.ts
          echo ""
          echo "=== DUMP CHALLENGE TEST ==="
          base64 -w 0 app/src/__tests__/challenge.test.ts
          echo ""
          echo "=== DONE9 ==="
