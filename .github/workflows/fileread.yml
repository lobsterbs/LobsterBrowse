name: fileread
on:
  push:
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: lobsterbs/LobsterBrowse
      - run: |
          set -e
          git clone --depth 50 https://github.com/lobsterbs/Zeolite /tmp/zeolite 2>&1 | tail -1
          cd /tmp/zeolite
          echo "=== B2A151F STAT ==="
          git show b2a151f --stat | head -20
          echo "=== B2A151F DIFF ==="
          git show b2a151f | head -180
          echo "=== PASSCHALLENGE LOG ==="
          git log -S "pass-challenge" --oneline | head -10
          echo "=== SW 956-1010 ==="
          sed -n '956,1010p' app/src/sw.ts
          echo "=== SW 1262-1430 ==="
          sed -n '1262,1430p' app/src/sw.ts
          echo "=== COOKIES 760-860 ==="
          sed -n '760,860p' app/src/cookies.ts
          echo "=== BOOTSTRAP LOCATION GREP ==="
          grep -n "location\|Location" app/src/bootstrap.ts | head -25
          echo "=== DONE7 ==="
