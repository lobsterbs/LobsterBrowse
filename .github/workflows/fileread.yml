name: fileread
on:
  push:
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: lobsterbs/LobsterBrowse
      - run: |
          set -e
          git clone --depth 50 https://github.com/lobsterbs/Zeolite /tmp/zeolite 2>&1 | tail -1
          cd /tmp/zeolite
          echo "ZLGITHASH-zeo $(git rev-parse HEAD)"
          echo "=== ZLOG ==="
          git log --oneline -20
          echo "=== ZLOGAPP ==="
          git log --oneline -15 -- app/src
          echo "=== WF ==="
          ls .github/workflows
          echo "=== ERRORPAGE REFS ==="
          grep -rn "errorpage" app/src --include="*.ts" | grep -v __tests__ | head -20
          echo "=== SW GREP ==="
          grep -n "route\|loading\|progress\|indicator\|interstitial\|errorPage" app/src/sw.ts | head -100
          echo "=== M3E GREP ==="
          grep -rn "m3e\|Google Sans\|material" app/src --include="*.ts" | grep -v __tests__ | head -20
          echo "=== BLOB SHA ERRPAGE ==="
          git rev-parse HEAD:app/src/errorpage.ts
          git cat-file -s $(git rev-parse HEAD:app/src/errorpage.ts)
          echo "=== DUMP ERRPAGE ==="
          split -b 8000 <(base64 -w 0 app/src/errorpage.ts) /tmp/zerr_
          i=0
          for f in /tmp/zerr_*; do
            i=$((i+1))
            echo "ZLFILE-zerr-$i-BEGIN"
            cat "$f"
            echo ""
            echo "ZLFILE-zerr-$i-END"
          done
          echo "=== MAINRS ANUBIS 3560-3790 ==="
          cd /home/runner/work/LobsterBrowse/LobsterBrowse
          sed -n '3560,3790p' server/bin/server/src/main.rs
          echo "=== DONE4 ==="
