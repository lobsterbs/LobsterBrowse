name: fileread-tmp
on: push
jobs:
  m1:
    runs-on: ubuntu-latest
    steps:
      - name: print chunks
        run: |
          read_range() {
            key="$1"; url="$2"; off="$3"; len="$4"
            curl -fsSL "$url" -o "tmp_$key"
            tail -c +"$off" "tmp_$key" | head -c "$len" > "f_$key"
            echo "ZLGITHASH-$key-$(git hash-object "f_$key")"
            echo "ZLSIZE-$key-$(wc -c < "f_$key")"
            split -b 8000 -d -a 2 "f_$key" "part_$key."
          for c in part_$key.*; do
            echo "ZLFILE-$key-${c#part_$key.}-BEGIN"
            base64 -w 0 "$c"
            echo
            echo "ZLFILE-$key-${c#part_$key.}-END"
          done
          rm -f "part_$key."*
          }
          read_range P1 "https://raw.githubusercontent.com/lobsterbs/LobsterBrowse/main/server/bin/server/src/main.rs" 1 60000
