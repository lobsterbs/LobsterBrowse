name: fileread
on:
  push:
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: lobsterbs/LobsterBrowse
      - run: |
          set -e
          git clone --depth 50 https://github.com/lobsterbs/Zeolite /tmp/zeolite 2>&1 | tail -1
          cd /tmp/zeolite
          git clone --depth 1 -b dist https://github.com/lobsterbs/Zeolite /tmp/zdist 2>&1 | tail -1
          echo "ZLGITHASH-zdist $(git -C /tmp/zdist rev-parse HEAD)"
          echo "=== ANUBIS HITS APP.SRC ==="
          grep -rn "anubis\|pass-challenge\|within.website" app/src --include="*.ts" | grep -v __tests__ | head -25
          echo "=== SW ANUBIS SECTIONS ==="
          for ln in $(grep -n "anubis\|pass-challenge\|within.website" app/src/sw.ts | cut -d: -f1); do
            s=$((ln-6)); [ $s -lt 1 ] && s=1
            e=$((ln+20))
            echo "--- sw.ts lines $s-$e (hit $ln) ---"
            sed -n "${s},${e}p" app/src/sw.ts
          done
          echo "=== SW 700-765 ==="
          sed -n '700,765p' app/src/sw.ts
          echo "=== SW 1000-1065 ==="
          sed -n '1000,1065p' app/src/sw.ts
          echo "=== SW 1129-1262 ==="
          sed -n '1129,1262p' app/src/sw.ts
          echo "=== ROUTEKEY.TS ==="
          cat app/src/routekey.ts
          echo "=== CODEC DECODE ==="
          grep -n "decode\|b64u\|token" app/src/codec.ts | head -30
          echo "=== ERRORPAGES DOC ==="
          head -60 docs/error-pages.md
          echo "=== LB ROUTE REG 3440-3558 ==="
          cd /home/runner/work/LobsterBrowse/LobsterBrowse
          sed -n '3440,3558p' server/bin/server/src/main.rs
          echo "=== LB IS_ANUBIS 2700-2810 ==="
          sed -n '2700,2810p' server/bin/server/src/main.rs
          echo "=== DONE5 ==="
