name: Generate UI lockfile

# #144: manual only. A push-triggered re-resolve raced CI (lockfile
# commits landing while the CI run for the triggering push was still
# in flight); lockfile updates now ride the push that changes the
# manifest, and this workflow remains as the manual fallback.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Resolve dependency tree
      working-directory: ui
      run: npm install --package-lock-only
    - name: Commit package-lock.json
      run: |
        git config user.name "lobster-ci"
        git config user.email "ci@users.noreply.github.com"
        git add ui/package-lock.json
        git diff --cached --quiet || (git commit -m "chore(ui): update package-lock.json" && git push)
