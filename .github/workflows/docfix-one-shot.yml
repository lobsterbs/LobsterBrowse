name: docfix one-shot (#501 doc paragraph)
on:
  push:
    paths:
      - ".github/workflows/docfix-one-shot.yml"
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Insert the missing doc paragraph break
        run: |
          python3 - <<'PYEOF'
          p = "bin/server/src/main.rs"
          s = open(p, encoding="utf-8").read()
          old = "engine deadline.\n/// send() resolves at the first response header"
          new = "engine deadline.\n///\n/// send() resolves at the first response header"
          n = s.count(old)
          assert n == 1, "anchor count " + str(n)
          open(p, "w", encoding="utf-8").write(s.replace(old, new))
          print("patched")
          PYEOF
        working-directory: server
      - name: Gates (fmt, build, relay tests)
        working-directory: server
        run: |
          cargo fmt --all
          cargo build --locked
          cargo test --locked relay
      - name: Commit and push if changed
        run: |
          git config user.name "zl-bot"
          git config user.email "zl-bot@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -A
            git commit -m "fix(server): break the relay-wait doc list before the send() paragraph (#501 rustc doc lint)"
            git push origin HEAD:${{ github.ref_name }}
          fi
