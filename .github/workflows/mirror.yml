name: Mirror to GitLab

on:
  push:
  create:
  delete:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    # LB#14: GITLAB_PAT lives in the 'lobster' environment secret store;
    # without this declaration the secret resolves empty and the push 401s.
    environment: lobster
    # GITLAB_PAT lives in the "lobster" environment's secrets, and
    # environment secrets are only exposed to jobs that declare the
    # environment (LB#14: without this the token resolves empty and the
    # push dies with authentication denied).
    environment: lobster
    steps:
      - name: Push mirror to GitLab
        run: |
          git clone --mirror https://github.com/lobsterbs/LobsterBrowse.git repo.git
          cd repo.git
          git push --mirror "https://oauth2:${{ secrets.GITLAB_PAT }}@gitlab.com/lobsterbs/LobsterBrowse.git"
