name: a11y patch
on:
  push:
    paths:
      - .github/workflows/a11y-patch.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply patch, commit, self-remove
        run: |
          echo '' | base64 -d > /tmp/a11y.patch
          git config user.name lobsterbs
          git config user.email jeglikerikkeskole@hotmail.com
          git apply --check /tmp/a11y.patch
          git apply /tmp/a11y.patch
          git add ui/src/components/ui/stars.tsx ui/src/CommandPalette.tsx ui/src/pages/Home.tsx ui/src/browser/ExtensionsPanel.tsx ui/src/pages/Browser.tsx ui/src/pages/Settings.tsx ui/src/theme.css
          git rm -q .github/workflows/a11y-patch.yml
          git commit -q -m "fix(ui): accessibility wave (#116-#121)"
          git push
